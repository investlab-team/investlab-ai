name: investlab-bundle
services:
  postgres:
    image: ${INVESTLAB_DB_IMAGE:?See images.json}
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RESEARCH_DB_ADMIN_PASSWORD:?Run start.ps1 first}
      POSTGRES_DB: investlab_research
      RESEARCH_DB_USERNAME: investlab_research
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Run start.ps1 first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - research-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'test -f "$${PGDATA}/investlab-seed-ready" && pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
  ai:
    image: ${INVESTLAB_APP_IMAGE:?See images.json}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESEARCH_DB_HOST: postgres
      RESEARCH_DB_PORT: "5432"
      RESEARCH_DB_NAME: investlab_research
      RESEARCH_DB_USERNAME: investlab_research
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD}
      INVESTLAB_AI_SERVICE_TOKEN: ${INVESTLAB_AI_SERVICE_TOKEN:?Run start.ps1 first}
      INVESTLAB_AI_ENABLE_LOCAL_CHAT: "true"
      INVESTLAB_AI_DART_API_KEY: ${INVESTLAB_AI_DART_API_KEY:-}
      INVESTLAB_AI_OPENAI_API_KEY: ${INVESTLAB_AI_OPENAI_API_KEY:-}
      INVESTLAB_AI_OPENAI_MODEL: ${INVESTLAB_AI_OPENAI_MODEL}
      INVESTLAB_AI_BASIC_ANALYSIS_TOKENS: ${INVESTLAB_AI_BASIC_ANALYSIS_TOKENS:-16000}
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
    ports:
      - "127.0.0.1:${INVESTLAB_CHAT_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
volumes:
  research-data:
