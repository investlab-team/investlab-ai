[project]
name = "investlab-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1,<2",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "defusedxml>=0.7,<1",
  "beautifulsoup4>=4.12,<5",
  "tiktoken>=0.9,<1",
  "python-dotenv>=1,<2",
  "lxml>=5,<7",
  "boto3>=1.35,<2",
  "filelock>=3.16,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/investlab_ai"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
