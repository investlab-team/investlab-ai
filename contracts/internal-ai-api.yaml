components:
  schemas:
    AnalysisPlan:
      properties:
        rceptNo:
          type: string
          title: Rceptno
        chunkCount:
          type: integer
          title: Chunkcount
        modelCalls:
          type: integer
          title: Modelcalls
        estimatedEvidenceTokens:
          type: integer
          title: Estimatedevidencetokens
      additionalProperties: false
      type: object
      required:
      - rceptNo
      - chunkCount
      - modelCalls
      - estimatedEvidenceTokens
      title: AnalysisPlan
    AnalysisRequest:
      properties:
        maxModelCalls:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Maxmodelcalls
          default: 10
      additionalProperties: false
      type: object
      title: AnalysisRequest
    Answer:
      properties:
        status:
          type: string
          enum:
          - answered
          - insufficient_evidence
          title: Status
        rceptNo:
          type: string
          title: Rceptno
        answer:
          type: string
          title: Answer
        claims:
          items:
            $ref: '#/components/schemas/Claim'
          type: array
          title: Claims
        sources:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Sources
        model:
          type: string
          title: Model
        modelCalls:
          type: integer
          title: Modelcalls
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        cached:
          type: boolean
          title: Cached
          default: false
        generatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generatedat
        analysisScope:
          type: string
          title: Analysisscope
          default: question
        inputTokens:
          type: integer
          title: Inputtokens
          default: 0
        outputTokens:
          type: integer
          title: Outputtokens
          default: 0
      additionalProperties: false
      type: object
      required:
      - status
      - rceptNo
      - answer
      - claims
      - sources
      - model
      - modelCalls
      - warnings
      title: Answer
    Claim:
      properties:
        category:
          type: string
          enum:
          - summary
          - business
          - performance
          - risk
          - follow_up
          title: Category
        text:
          type: string
          maxLength: 3000
          minLength: 1
          title: Text
        evidenceIds:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Evidenceids
      additionalProperties: false
      type: object
      required:
      - category
      - text
      - evidenceIds
      title: Claim
    Company:
      properties:
        companyId:
          type: string
          title: Companyid
        corpCode:
          type: string
          pattern: ^\d{8}$
          title: Corpcode
